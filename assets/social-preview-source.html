<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<title>بطاقة المكتبة المدرسية الرقمية</title>
<style>
@page{size:1200px 630px;margin:0}
*{box-sizing:border-box}html,body{margin:0;font-family:"Noto Sans Arabic",sans-serif;color:#183752}
.card{direction:ltr;background:#f8fafc;width:1200px;height:630px;overflow:hidden}
.photo{float:left;width:672px;background:#243c57}
.photo img{display:block;width:100%;height:582px;object-fit:cover}
.photo p{margin:0;padding:6px 24px;color:#fff;font-size:11px;line-height:1.4;direction:rtl}
.copy{margin-left:672px;width:528px;padding:36px 44px 24px;direction:rtl}
.brand{display:flex;align-items:center;gap:16px;font-weight:700;font-size:18px;line-height:1.5}
.brand img{width:48px;height:48px}
.eyebrow{color:#ad8044;font-size:17px;font-weight:700;margin:28px 0 12px}
h1{font-size:44px;line-height:1.4;margin:0 0 10px;font-weight:700}
h2{color:#385dcc;font-size:30px;line-height:1.4;margin:0 0 20px}
.description{font-size:18px;line-height:1.8;color:#596878;margin:0}
.tags{display:flex;gap:10px;margin-top:36px;font-size:14px;font-weight:600;color:#38556f}
.tags span{background:#eaf0fb;border-radius:20px;padding:6px 12px}
</style>
<main class="card">
<section class="photo"><img src="header-gallery/library-bookshelf.webp" alt="رفوف كتب"><p>صورة رفوف الكتب: Mshuang2 · CC0</p></section>
<section class="copy">
<div class="brand"><img src="mark.svg" alt=""><span>مكتبات المدارس في بورسعيد</span></div>
<p class="eyebrow">بوابة القراءة والمعرفة</p>
<h1>المكتبة المدرسية<br>الرقمية</h1>
<h2>كتابك أقرب</h2>
<p class="description">ابحث عن الكتب، واستكشف القراءة الرقمية، وتابع أخبار التعليم والبحوث المفتوحة من مصادرها الأصلية.</p>
<div class="tags"><span>الكتب</span><span>القراءة الرقمية</span><span>أخبار التعليم</span></div>
</section>
</main>
</html>
