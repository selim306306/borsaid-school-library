<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="تعيين كلمة مرور آمنة لحساب موظفي مكتبات بورسعيد المدرسية.">
  <title>تعيين كلمة المرور | مكتبات بورسعيد المدرسية</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./site.css">
  <script type="module" src="./set-password.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="./" aria-label="العودة إلى مكتبات بورسعيد المدرسية">
      <img src="./assets/mark.svg" alt="" width="44" height="44">
      <span><strong>مكتبات بورسعيد</strong><small>شبكة المكتبات المدرسية</small></span>
    </a>
    <section class="auth-card" aria-labelledby="passwordTitle">
      <span class="eyebrow">حساب موظف · خطوة أخيرة</span>
      <h1 id="passwordTitle">تعيين كلمة المرور</h1>
      <p class="auth-intro">أنشئ كلمة مرور لحسابك للوصول إلى مساحة الموظفين. لا تشاركها مع أي شخص.</p>
      <form id="passwordForm" class="auth-form" hidden>
        <label for="newPassword">كلمة المرور الجديدة</label>
        <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required dir="ltr" aria-describedby="passwordHint">
        <small id="passwordHint" class="auth-hint">استخدم 8 أحرف على الأقل.</small>
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input id="confirmPassword" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required dir="ltr">
        <button id="savePasswordButton" class="button button-primary" type="submit">حفظ كلمة المرور</button>
      </form>
      <p id="authStatus" class="auth-status" role="status" aria-live="polite">جارٍ التحقق من رابطك...</p>
      <a class="button button-outline auth-return" href="./">العودة إلى الموقع</a>
    </section>
    <p class="auth-footer">إذا انتهت صلاحية الرابط، اطلب رابط تعيين جديداً من شاشة دخول الموظفين.</p>
  </main>
</body>
</html>
